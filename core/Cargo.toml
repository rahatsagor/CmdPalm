[package]
name = "cmdpalm-core"
description = "CmdPalm host core: local server, pairing, and macOS input engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "cmdpalm_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi = "0.32"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }
sha2 = "0.11"
rand = "0.10"
base64 = "0.23"
if-addrs = "0.15"
time = "0.3"
socket2 = "0.6"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "test-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "connect"] }
