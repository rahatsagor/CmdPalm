<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta name="color-scheme" content="dark light" />
    <title>CmdPalm</title>
    <!-- Opened by the service worker when the Mac can't be reached and the
         app itself isn't cached yet. Self-contained: nothing else may load. -->
    <style>
      :root {
        --bg: #0a0b0d;
        --surface: #141619;
        --surface-2: #1b1e22;
        --line: rgb(255 255 255 / 0.14);
        --text: #eceef1;
        --muted: #8d949e;
        --faint: #5b616a;
        --accent: #ff8a3d;
        --accent-soft: rgb(255 138 61 / 0.16);
        --accent-text: #1a0e05;
        --warn: #f5b942;
        --shadow: 0 18px 40px rgb(0 0 0 / 0.35);
        color-scheme: dark;
      }
      :root.light {
        --bg: #eef0f3;
        --surface: #ffffff;
        --surface-2: #f5f6f8;
        --line: rgb(0 0 0 / 0.12);
        --text: #15171a;
        --muted: #69707a;
        --faint: #a0a6ae;
        --accent: #f0701f;
        --accent-soft: rgb(240 112 31 / 0.14);
        --accent-text: #ffffff;
        --shadow: 0 14px 32px rgb(0 0 0 / 0.12);
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: env(safe-area-inset-top) max(2rem, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(2rem, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        text-align: center;
        overflow: hidden;
      }
      .glow {
        position: fixed;
        inset: 0 0 35% 0;
        background: radial-gradient(ellipse 70% 55% at 50% 30%, var(--accent-soft), transparent 70%);
        opacity: 0.7;
        pointer-events: none;
      }
      main {
        position: relative;
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 22rem;
        padding: 2.5rem 0;
      }
      .art {
        position: relative;
        display: grid;
        place-items: center;
        width: 9rem;
        height: 9rem;
        margin-bottom: 2rem;
      }
      .ring {
        position: absolute;
        inset: 18px;
        border-radius: 999px;
        border: 1.5px solid var(--line);
        animation: ripple 4s cubic-bezier(0.2, 0.6, 0.3, 1) infinite;
      }
      .ring + .ring {
        animation-delay: 2s;
      }
      @keyframes ripple {
        from {
          transform: scale(0.75);
          opacity: 0.9;
        }
        to {
          transform: scale(1.35);
          opacity: 0;
        }
      }
      .device {
        position: relative;
        display: grid;
        place-items: center;
        width: 6rem;
        height: 6rem;
        border: 1px solid var(--line);
        border-radius: 30px;
        background: var(--surface-2);
        box-shadow: var(--shadow);
        color: var(--muted);
      }
      .badge {
        position: absolute;
        right: -0.5rem;
        bottom: -0.5rem;
        display: grid;
        place-items: center;
        width: 2.5rem;
        height: 2.5rem;
        border: 3px solid var(--bg);
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--warn);
      }
      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0.5rem 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
      }
      ul {
        width: 100%;
        margin: 1.75rem 0 0;
        padding: 0;
        list-style: none;
        text-align: left;
      }
      li {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        min-height: 3rem;
        margin-top: 0.375rem;
        padding: 0.625rem 1rem;
        border-radius: 1rem;
        background: var(--surface);
        font-size: 14px;
        line-height: 1.35;
      }
      li span {
        display: grid;
        flex-shrink: 0;
        place-items: center;
        width: 2rem;
        height: 2rem;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
      }
      button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        height: 3rem;
        margin-top: 1.75rem;
        border: 0;
        border-radius: 1rem;
        background: var(--accent);
        color: var(--accent-text);
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
      button.busy svg {
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      footer {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding-bottom: 1.5rem;
        color: var(--faint);
        font-size: 13px;
      }
      footer::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--warn);
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <main role="status" aria-live="polite">
      <div class="art" aria-hidden="true">
        <span class="ring"></span><span class="ring"></span>
        <div class="device">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 5a2 2 0 0 1 2 2v8.526a2 2 0 0 0 .212.897l1.068 2.127a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45l1.068-2.127A2 2 0 0 0 4 15.526V7a2 2 0 0 1 2-2z" />
            <path d="M20.054 15.987H3.946" />
          </svg>
          <span class="badge">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 5h4" /><path d="M20 3v4" /><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" />
            </svg>
          </span>
        </div>
      </div>
      <h1 id="title">Can’t reach your Mac</h1>
      <p id="detail">It may be asleep, turned off or on another network. CmdPalm opens by itself as soon as it’s back.</p>
      <ul>
        <li>
          <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10" /><path d="M18.4 6.6a9 9 0 1 1-12.77.04" /></svg></span>
          <b id="awake" style="font-weight: 400">Your Mac is on and awake</b>
        </li>
        <li>
          <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2" /><path d="M6 8h.01" /><path d="M10 8h.01" /><path d="M14 8h.01" /></svg></span>
          CmdPalm is running in its menu bar
        </li>
        <li>
          <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01" /><path d="M2 8.82a15 15 0 0 1 20 0" /><path d="M5 12.859a10 10 0 0 1 14 0" /><path d="M8.5 16.429a5 5 0 0 1 7 0" /></svg></span>
          This phone is on the same Wi-Fi
        </li>
      </ul>
      <button id="retry" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" />
        </svg>
        Try again
      </button>
    </main>
    <footer>Trying to reconnect</footer>
    <script>
      ;(() => {
        const read = (key) => {
          try {
            return localStorage.getItem(key)
          } catch {
            return null
          }
        }
        let theme = 'system'
        try {
          theme = JSON.parse(read('cmdpalm.settings') || '{}').theme || 'system'
        } catch {}
        const light = theme === 'light' || (theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
        if (light) {
          document.documentElement.classList.add('light')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#eef0f3')
        }

        const name = read('cmdpalm.hostName')
        if (name) {
          document.getElementById('title').textContent = `Can’t reach ${name}`
          document.getElementById('awake').textContent = `${name} is on and awake`
        }

        const retry = document.getElementById('retry')
        let checking = false
        async function check(manual) {
          if (checking) return
          checking = true
          if (manual) retry.classList.add('busy')
          const abort = new AbortController()
          const timer = setTimeout(() => abort.abort(), 3000)
          try {
            const response = await fetch('/api/info', { cache: 'no-store', signal: abort.signal })
            if (response.ok) return location.reload()
          } catch {
            // Still unreachable.
          } finally {
            clearTimeout(timer)
            checking = false
            setTimeout(() => retry.classList.remove('busy'), 600)
          }
        }
        retry.addEventListener('click', () => check(true))
        setInterval(() => document.visibilityState === 'visible' && check(false), 4000)
        addEventListener('online', () => check(false))
        document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && check(false))
      })()
    </script>
  </body>
</html>
