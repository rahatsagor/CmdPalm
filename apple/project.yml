# Generate the Xcode project with `xcodegen` (scripts/build-app.sh does this).
name: CmdPalm
options:
  bundleIdPrefix: app.cmdpalm
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.2"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES

targets:
  CmdPalm:
    type: application
    platform: macOS
    sources:
      - path: CmdPalm
      - path: Generated/cmdpalm_core.swift
        optional: true
    dependencies:
      - package: Sparkle
    preBuildScripts:
      - name: Build Rust core
        script: '"$SRCROOT/../scripts/build-core.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Generated/cmdpalm_core.swift
    postCompileScripts:
      - name: Bundle web client
        # The phone client is served from Contents/Resources/web.
        script: '"$SRCROOT/../scripts/bundle-web.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cmdpalm.mac
        PRODUCT_NAME: CmdPalm
        INFOPLIST_FILE: CmdPalm/Info.plist
        CODE_SIGN_ENTITLEMENTS: CmdPalm/CmdPalm.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated
        # Link the static library by path: the same folder holds the dylib
        # used for binding generation, which -l would pick instead.
        OTHER_LDFLAGS:
          - $(SRCROOT)/../target/aarch64-apple-darwin/release/libcmdpalm_core.a
          - -framework IOKit
          - -framework Carbon
          - -framework CoreGraphics
        OTHER_SWIFT_FLAGS: -Xcc -fmodule-map-file=$(SRCROOT)/Generated/cmdpalm_coreFFI.modulemap
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CMDPALM_UPDATE_FEED: https://github.com/rahatsagor/CmdPalm/releases/latest/download/appcast.xml
        CMDPALM_UPDATE_KEY: ""

  CmdPalmTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CmdPalmTests
    dependencies:
      - target: CmdPalm
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CmdPalm.app/Contents/MacOS/CmdPalm
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.cmdpalm.mac.tests
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated
        OTHER_SWIFT_FLAGS: -Xcc -fmodule-map-file=$(SRCROOT)/Generated/cmdpalm_coreFFI.modulemap

schemes:
  CmdPalm:
    build:
      targets:
        CmdPalm: all
        CmdPalmTests: [test]
    test:
      targets:
        - CmdPalmTests
