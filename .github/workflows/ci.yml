name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  core:
    name: Rust core
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  web:
    name: Phone client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Check release scripts
        # The scripts in scripts/ use the phone client's lint and TypeScript setup.
        working-directory: .
        run: |
          web/node_modules/.bin/oxlint scripts
          web/node_modules/.bin/tsc -p scripts

  app:
    name: Mac app
    # GitHub currently provides the stable Xcode 27 compiler on this preview image.
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install build tools
        run: |
          brew update
          brew install xcodegen actionlint
          brew upgrade xcodegen actionlint
      - name: Check release tooling and workflows
        run: |
          actionlint
          bun test ./scripts/tests
      - name: Generate Swift bindings
        # XcodeGen must see the generated Swift file on a fresh checkout.
        run: scripts/build-core.sh
      - name: Build phone client
        working-directory: web
        run: bun install --frozen-lockfile && bun run build
      - name: Generate project
        working-directory: apple
        run: xcodegen generate
      - name: Test
        env:
          CMDPALM_SKIP_WEB: "1"
        run: |
          mkdir -p build
          xcodebuild test \
            -project apple/CmdPalm.xcodeproj \
            -scheme CmdPalm \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination "platform=macOS,arch=arm64" \
            -resultBundlePath build/Tests.xcresult \
            | tee build/xcodebuild-test.log
      - name: Build release app
        run: scripts/build-app.sh
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-app-diagnostics
          path: |
            build/*.log
            build/Tests.xcresult
          retention-days: 7
          if-no-files-found: ignore
