version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # The Vue type checker doesn't support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
